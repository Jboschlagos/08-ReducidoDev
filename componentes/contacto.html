<main class="container content">
  <a href="#" class="back-btn" data-page="home">← Volver</a>

  <div class="contacto-content">
    <span class="eyebrow">Contacto</span>
    <h1>Hablemos de tu proyecto</h1>
    <p class="contacto-intro">
      Si tienes un proyecto o una idea clara, se puede trabajar. Contame de qué
      se trata.
    </p>

    <!-- Endpoint real de Formspree, conectado a jboschlagos@gmail.com -->
    <form
      class="contacto-form"
      action="https://formspree.io/f/xeeyvoly"
      method="POST"
    >
      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" required />
      </div>

      <div class="form-group">
        <label for="email">Correo</label>
        <input type="email" id="email" name="email" required />
      </div>

      <div class="form-group">
        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" name="message" rows="5" required></textarea>
      </div>

      <!-- Honeypot anti-spam: campo oculto, si un bot lo completa Formspree descarta el envío -->
      <input
        type="text"
        name="_gotcha"
        style="display: none"
        tabindex="-1"
        autocomplete="off"
      />

      <button type="submit" class="btn btn-primary">Enviar mensaje</button>
    </form>

    <div class="contacto-redes">
      <a
        href="https://www.instagram.com/jboschlagos?igsh=MTRtZXBjeGNrazU5OQ=="
        target="_blank"
        rel="noopener noreferrer"
        class="btn btn-outline"
        >Instagram</a
      >
      <a
        href="https://github.com/Jboschlagos"
        target="_blank"
        rel="noopener noreferrer"
        class="btn btn-outline"
        >GitHub</a
      >
      <a
        href="https://www.linkedin.com/in/jorgeboschlagos/"
        target="_blank"
        rel="noopener noreferrer"
        class="btn btn-outline"
        >LinkedIn</a
      >
    </div>
  </div>
</main>
